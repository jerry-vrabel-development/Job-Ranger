version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier', 'prettier-*']
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*']
      test:
        patterns: ['vitest', '@vitest/*']
    open-pull-requests-limit: 5
    ignore:
      # Playwright is pinned to the CI container image; move both together, by hand.
      - dependency-name: '@playwright/test'
      # typescript-eslint doesn't support TypeScript 7 yet; lint would stop.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @types/node follows the Node in .nvmrc (22). Move it with .nvmrc, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Adapter 9 builds its own Worker with only fetch, so the daily fetch's
      # scheduled handler would be dropped. Held at 8 until the cron moves to
      # its own Worker. Minor and patch updates still come.
      - dependency-name: '@sveltejs/adapter-cloudflare'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
