<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- Installable on a phone (design note 0009). Cloudflare Access guards every path, and browsers
		     fetch a manifest without cookies unless told otherwise, so it's fetched with them. -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Job Ranger" />
		<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131715" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app">%sveltekit.body%</div>
	</body>
</html>
